schema_version: 1

context:
  name: beaupy
  version: "4.0.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/beaupy-${{ version }}.tar.gz
  sha256: c2118ba6fdbbf4e7415c2477c43ee273d1365152d0a868e512585f251884ccba

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - poetry-core >=1.2.0
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}
    - rich >=14.3.0
    - questo >=0.4.2,<0.5.0
    - python-yakh >=0.4.2,<0.5.0

tests:
  - python:
      imports:
        - beaupy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A library of elements for interactive TUIs in Python
  license: MIT
  license_file:
    - LICENSE
  homepage: https://github.com/petereon/beaupy
  documentation: https://petereon.github.io/beaupy/

extra:
  recipe-maintainers:
    - petereon
    - thewchan
